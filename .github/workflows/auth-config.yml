name: Auth settings

# Applies supabase/auth (site URL, allowed redirects, Spanish login email, Resend SMTP)
# to the Supabase project through the Management API.
# The SUPABASE_ACCESS_TOKEN needs Auth Config and Project Settings with Read-write access.
on:
  push:
    branches: [main]
    paths:
      - "supabase/auth/**"
      - "src/config/product.json"
      - ".github/workflows/auth-config.yml"
  workflow_dispatch:

jobs:
  apply:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
      RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply auth settings
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ] || [ -z "$SUPABASE_PROJECT_ID" ]; then
            echo "::notice::Supabase secrets are not set yet; auth settings were not applied."
            exit 0
          fi
          if [ -z "$RESEND_API_KEY" ]; then
            echo "::warning::RESEND_API_KEY is not set; login emails will use Supabase's limited sender."
          fi
          node supabase/auth/build-settings.mjs > "$RUNNER_TEMP/auth-settings.json"
          status=$(curl -sS -o "$RUNNER_TEMP/response.json" -w "%{http_code}" -X PATCH \
            "https://api.supabase.com/v1/projects/$SUPABASE_PROJECT_ID/config/auth" \
            -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
            -H "Content-Type: application/json" \
            --data @"$RUNNER_TEMP/auth-settings.json")
          echo "HTTP $status"
          if [ "$status" = "401" ] || [ "$status" = "403" ]; then
            echo "::warning::The Supabase token can't change auth settings yet. It needs Auth Config and Project Settings with Read-write access."
            exit 0
          fi
          if [ "$status" -ge 300 ]; then
            # The error body never contains our secrets, only the reason.
            cat "$RUNNER_TEMP/response.json"; echo
            exit 1
          fi
          node -e '
            const r = require(process.env.RUNNER_TEMP + "/response.json");
            const keys = ["site_url", "uri_allow_list", "disable_signup", "mailer_otp_length", "smtp_host", "smtp_admin_email", "smtp_sender_name", "mailer_subjects_magic_link"];
            for (const k of keys) console.log(k + ":", JSON.stringify(r[k]));
          '
